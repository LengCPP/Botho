<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td style="padding: 20px 0 30px 0;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 40px 0 30px 0; background-color: #5e2b3b;">
              <h1 style="color: #ffffff; margin: 0; font-size: 24px;">{{ project_name }}</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding: 40px 30px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="color: #333333; font-size: 16px; line-height: 24px;">
                    <p style="margin: 0 0 20px 0;">Hi {{ username }},</p>
                    <p style="margin: 0 0 20px 0;">Thanks for signing up! Please verify your email address by clicking the button below:</p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding: 20px 0;">
                    <a href="{{ link }}" style="background-color: #5e2b3b; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; display: inline-block;">Verify Email</a>
                  </td>
                </tr>
                <tr>
                  <td style="color: #333333; font-size: 16px; line-height: 24px;">
                    <p style="margin: 20px 0 0 0;">This link will expire in 60 seconds.</p>
                    <p style="margin: 20px 0 0 0;">If you didn't create an account, you can safely ignore this email.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color: #f8f9fa; padding: 20px 30px;">
              <p style="margin: 0; font-size: 14px; color: #999999; text-align: center;">&copy; {{ project_name }}. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
